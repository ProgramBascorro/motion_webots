# 23 OKT 2026: x/z/roll/pitch/yaw/hip_pitch offset di bawah = ACUAN PAGE 2, hasil
# FK page 2 WALKING_READY di ALPHONSE.bin (satu sumber:
# src/bascorro_studio/data/walking_ready_reference.json, dibaca juga oleh Bascorro
# Studio dan demo D60). Jangan disunting tangan -- sesudah page 2 di-teach ulang,
# scripts/walking_ready_fk.py --write menulis keenamnya bersama acuan itu dan
# menggeser semua versi tersimpan. Angka lama (-0.02 / 0.0408 / -4.0107 deg) yang
# disebut di bawah adalah acuan sebelum tanggal itu.
#
# y_offset juga 0 sejak 23 Okt 2026 (dulu 0.028): lebar kaki = page 2 persis,
# sama dengan semua versi Studio. Bukan bagian acuan -- skrip tidak menyentuhnya.
#
# DIKEMBALIKAN 2026-09-06 ke isi 3 September 2026 (akhir hari, WIB), atas
# permintaan operator: "batalkan semua perubahan yang telah terjadi setelah
# tanggal 3 September".
#
# Isinya = preset Bascorro Studio "dari ketua" (tersimpan 2026-08-18, disalin
# ke sini 2026-08-22). Itulah keadaan berkas ini sepanjang 22 Agustus sampai
# 3 September.
#
# TIGA SAKLAR DICABUT, kunci di sini MAUPUN kodenya di op3_walking_module:
#
#   walking_bias_enable     (dipasang 2026-09-04)
#   soft_start_enable       (dipasang 2026-09-06)
#   first_step_half_enable  (dipasang 2026-09-06)
#
# Ikut dicabut: seluruh perbaikan soft start 5-6 September (softStartActive(),
# pelepasan ramp saat Apply, penjagaan di timeRampScale/startWalking), dan
# checkPoseReference()/restorePoseReference() di op3_demo/ball_follower.
# Jadi walking_module dan ball_follower kembali ke perilaku 3 September:
# walking_bias_ selalu hidup, soft start apa adanya, langkah pertama dipotong
# setengah, dan tidak ada snapshot acuan pose antar run.
#
# YANG DIBATALKAN DIBANDING KEADAAN 6 SEPTEMBER:
#   x_offset          -0.02   (sempat -0.03)
#   pitch_offset      -4.0107 (sempat -6.8755)
#   hip_pitch_offset   7.9985 (sempat  8.0214)
#   period_time        800    (sempat  770)
#   dsp_ratio          0.58   (sempat  0.4)
#   step_fb_ratio      0.2    (sempat  0.25)
#   soft_start_time    2000   (sempat  50)
#   swing_right_left  -0.002  (sempat  0.0021)
#   swing_top_down     0.006  (sempat  0)
#   pelvis_offset      3.0023 (sempat  2.8648)
#   p_gain             36     (sempat  16)
#
# AKIBAT YANG PERLU DIINGAT. Berkas ini adalah TITIK ACUAN perekaman
# walking_bias_, bukan salinan preset:
#
#     pose robot = page 2 + [ neutral(preset yang hidup) - neutral(berkas ini) ]
#
# Karena isinya kembali berbeda dengan preset JALAN KE SURGA, init pose preset
# itu terasa lagi di robot: x -10,0 mm, pitch -2,8648 deg, hip_pitch +0,0229
# deg terhadap pose page 2. Itu memang keadaan 3 September.
#
# SATUANNYA BEDA dengan Bascorro Studio: di sini DERAJAT dan MILIDETIK, di sana
# radian dan detik. loadWalkingParam() yang mengalikan DEGREE2RADIAN dan 0,001.
# Nama kuncinya juga beda: foot_height / swing_right_left / swing_top_down =
# z_move_amplitude / y_swap_amplitude / z_swap_amplitude, dan
# step_forward_back_ratio = step_fb_ratio.
#
# walking_module membaca berkas ini SEKALI saat boot, jadi sesudah diubah
# op3_manager harus dijalankan ulang. Demo menimpa x/y/angle move amplitude di
# atasnya lewat preset dan ramp-nya sendiri.
#
# Jaga WALKING_DEFAULT_PARAMS di bascorro_studio/web/src/App.jsx tetap seirama
# dengan berkas ini -- itu yang dilihat operator sebelum menekan Load.
#
# NOTE: sending "save" on /robotis/walking/command rewrites this file and drops comments.

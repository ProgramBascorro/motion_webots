# Parameters for the LANDMARK detector (best_landmark_v8n) running an OpenVINO
# model. Runs the SAME node as the lapangan detector — scripts/yolo_field_detector.py
# — a MULTI-CLASS detector that publishes every detection WITH its class label/
# score as vision_msgs/Detection2DArray on `detections`. It does NOT feed the
# ball pipeline.
#
# This file is a SEPARATE profile: yolo_field_detector_openvino_params.yaml
# (model v8n_lapangan_best, 8 kelas, imgsz 320) is left exactly as it was, so
# both can be tried without disturbing each other.
#
# Applied via the "/**" wildcard so they reach the node regardless of the
# namespace/name it is launched under.
/**:
  ros__parameters:
    # OpenVINO model is a DIRECTORY (.xml + .bin + metadata.yaml), not a single
    # file. Relative to the package share dir or an absolute path.
    #
    # NOTE: best_landmark_v8n was exported with quantize=8 (INT8), so the .bin
    # is small (~3.0 MB) compared to the FP32 lapangan model (12 MB).
    model_path: "model/best_landmark_v8n_openvino_model"

    # OpenVINO carries no task ultralytics auto-detects reliably; set it.
    model_task: "detect"

    # Subscribe to a CompressedImage (true) or a raw Image (false) on image_in.
    use_compressed: true

    # Detection thresholds / inference settings.
    confidence_threshold: 0.5
    iou_threshold: 0.45

    # MUST match the imgsz the model was exported with. best_landmark_v8n is
    # 640 (its IR input is a static [1,3,640,640]) — NOT 320 like the lapangan
    # model. A mismatch makes OpenVINO reject the input tensor outright.
    imgsz: 640

    # OpenVINO runs on the Intel CPU; keep device "cpu" and half false. (INT8
    # precision is baked into the IR at export time, not set via this flag.)
    device: "cpu"
    half: false

    # Landmark models can have many boxes on screen (corners, lines, goal...).
    max_detections: 30

    # Which model class names to KEEP. Empty ([]) = keep every class.
    # best_landmark_v8n exposes 5:
    #   0: L   1: T   2: X   3: goalpost   4: center_circle
    # To filter, list the exact names, e.g. ["goalpost", "center_circle"].
    target_classes: []

    # Inference loop rate (Hz). Landmark detection needs less frequency than the
    # ball head-tracker; 15 Hz keeps CPU budget for walking + the ball node.
    detection_rate: 15.0

    # Publish an annotated debug image on image_out.
    publish_image: true
    detection_frame_id: "detector"

    # Start detecting immediately, or wait for "enable" (std_msgs/Bool) = true.
    enable_at_start: true

yolo_detector:
  ros__parameters:
    image_topic: /robotis_op3/camera/image_raw
    camera_info_topic: /robotis_op3/camera/camera_info
    green_mask_topic: /vision/green/mask
    output_frame: odom
    camera_frame: cam_link
    model_path: models/yolo.onnx
    input_size: 640
    ball_confidence_threshold: 0.2
    goalpost_confidence_threshold: 0.5
    robot_confidence_threshold: 0.2
    intersection_confidence_threshold: 0.4
    nms_threshold: 0.5
    nms_score_threshold: 0.1
    publish_debug: true
    use_green_horizon: true
    ground_z: 0.0
    max_range_m: 10.0
    horizon_max_age_sec: 0.25
    horizon_offset_px: 2
    horizon_stride: 4
    horizon_smooth_window: 9
    min_green_columns_ratio: 0.1

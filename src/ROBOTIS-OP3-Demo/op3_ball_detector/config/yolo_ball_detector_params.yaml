# Parameters for the YOLO ball detector (yolo_ball_detector.py).
# Applied via the "/**" wildcard so they reach the node regardless of the
# namespace/name it is launched under.
/**:
  ros__parameters:
    # Absolute path to the YOLO weights. Leave empty to use the model that
    # ships with this package: <share>/op3_ball_detector/model/best.pt
    model_path: "model/v8n.pt"

    # Model task. .pt weights carry this in metadata, so "detect" just matches;
    # mainly relevant for .onnx (see the *_onnx_params.yaml).
    model_task: "detect"

    # Subscribe to a CompressedImage (true) or a raw Image (false) on image_in.
    use_compressed: true

    # Detection thresholds / inference settings.
    confidence_threshold: 0.5
    iou_threshold: 0.45
    imgsz: 640
    device: "cpu"          # "cpu" or e.g. "cuda:0" when a GPU is available
    half: false            # FP16 inference (GPU only)
    max_detections: 10

    # Model class names to treat as "the ball". best.pt exposes "Bola-baru".
    # If none of these match the model, every class is treated as a ball.
    target_classes: ["Bola-baru"]

    # Inference loop rate (Hz). Always uses the freshest camera frame.
    detection_rate: 30.0

    # Publish an annotated debug image on image_out.
    publish_image: true
    detection_frame_id: "detector"

    # Start detecting immediately, or wait for "enable" (std_msgs/Bool) = true.
    enable_at_start: true

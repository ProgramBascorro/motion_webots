# Parameters for the GOAL-LINE (garis gawang) detector — scripts/yolo_goalline_detector.py.
#
# It runs the best_landmark_v8n model that ships in model/landmark_deploy.zip
# (5 classes: L, T, X, goalpost, center_circle) and reduces those boxes to ONE
# geometric answer: the line through the FEET of the goalposts, refined with the
# L/T/X line junctions that already lie on it.
#
# This is a SEPARATE profile from yolo_landmark_detector_openvino_params.yaml
# (which feeds the generic multi-class field node); both can be used without
# disturbing each other.
#
# Applied via the "/**" wildcard so the values reach the node whatever
# namespace/name it is launched under.
/**:
  ros__parameters:
    # ---------------------------------------------------------------- model
    # An OpenVINO model is a DIRECTORY (.xml + .bin + metadata.yaml), not one
    # file. Relative paths resolve against the package share dir. The .pt and
    # .onnx exports of the same weights sit next to it in model/ if you want to
    # compare backends:
    #   model/best_landmark_v8n.pt
    #   model/best_landmark_v8n.onnx
    model_path: "model/best_landmark_v8n_openvino_model"

    # OpenVINO carries no task ultralytics detects reliably; set it explicitly.
    model_task: "detect"

    # Subscribe to a CompressedImage (true) or a raw Image (false) on image_in.
    use_compressed: true

    # ------------------------------------------------------------ inference
    confidence_threshold: 0.5
    iou_threshold: 0.45

    # MUST match the exported size. best_landmark_v8n's OpenVINO IR input is a
    # STATIC [1,3,640,640], so 640 — a mismatch makes OpenVINO reject the
    # tensor outright. Re-export the model to change this.
    imgsz: 640

    # OpenVINO runs on the Intel CPU. INT8 precision is baked into this IR at
    # export time (quantize=8), not selected by the "half" flag.
    device: "cpu"
    half: false

    # A landmark frame can hold many boxes (junctions everywhere).
    max_detections: 30

    # Inference loop rate (Hz). 640 px on this CPU costs ~40 ms/frame, so ~10 Hz
    # is honest; ask for more and the loop simply runs as fast as it can while
    # the model ceiling logged at start-up tells you the truth. Keep it low —
    # the ball detector and the walking controller need the same cores.
    detection_rate: 10.0

    # ------------------------------------------------------- goal geometry
    # Goalposts needed before a line is fitted. 2 = both posts visible, the
    # honest setting: two feet define the line. Set 1 only if you also leave
    # use_landmarks on — one foot plus junctions on the same line can still fit,
    # but far less reliably.
    min_goalposts: 2

    # Pull L/T/X junctions that already lie on the post-to-post line into the
    # fit. They extend the segment towards the field corner and steady the
    # angle. Turn off to trust the goalposts alone.
    use_landmarks: true

    # How close (pixels, perpendicular) a junction must be to the seed line
    # before it is accepted as lying on it.
    landmark_band_px: 40.0

    # Reject a fit whose support points are not collinear enough: 1.0 = a
    # perfect line, 0 = a blob. Guards against a junction on the SIDE line
    # dragging the goal line off.
    min_linearity: 0.90

    # Reject a goal-line segment shorter than this (px) — two posts detected
    # almost on top of each other are a double detection, not a goal.
    min_length_px: 30.0

    # Endpoint smoothing: weight of the PREVIOUS frame in the EMA. 0 = raw and
    # jumpy, 0.5 = calm, 0.8 = sluggish while walking.
    smoothing: 0.5

    # When a frame finds nothing, keep the previous line this long (s) instead
    # of blinking out. At ~10 FPS, 0.4 s covers a 4-frame gap.
    hold_sec: 0.4

    # --------------------------------------------------------------- output
    # Annotated debug image on image_out. The overlay is only rendered while
    # somebody subscribes, so leaving this true costs nothing in a match.
    publish_image: true

    # Draw the raw YOLO boxes under the goal line in that debug image.
    draw_boxes: true

    detection_frame_id: "detector"

    # Start detecting immediately, or wait for "enable" (std_msgs/Bool) = true.
    enable_at_start: true

    # ------------------------------------------------------- FPS reporting
    # Seconds between the live "FPS ... | goal line ..." log lines. The same
    # value is published continuously on the "fps" topic regardless.
    fps_log_period: 5.0

    # Length of the sliding window the live FPS is measured over (s).
    fps_window_sec: 2.0

    # Frames used at start-up to measure the model's FPS CEILING on this
    # machine (logged once, before any camera frame arrives). 0 disables it.
    startup_benchmark_frames: 5

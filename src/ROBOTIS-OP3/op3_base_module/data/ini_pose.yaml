  5 : 167.607422       # r_el          (raw 3955)
  6 : -172.177734      # l_el          (raw   89 = -172° after wrap)
  7 : -0.263672        # r_hip_yaw     (raw 2045)
  8 : -0.263672        # l_hip_yaw     (raw 2045)
  9 : 3.515625         # r_hip_roll    (raw 2088) — splayed
  10 : -6.855469       # l_hip_roll    (raw 1970) — splayed

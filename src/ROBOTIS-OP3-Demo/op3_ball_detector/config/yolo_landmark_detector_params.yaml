# Parameters for the LANDMARK detector — scripts/yolo_landmark_detector.py.
#
# Runs the INT8 OpenVINO export from model/landmark_deploy/ and publishes EVERY
# landmark it sees with its class label and score, as vision_msgs/
# Detection2DArray on `detections`. It is the RAW landmark feed; it does not
# interpret the geometry.
#
# Do not confuse this file with its two neighbours:
#   yolo_landmark_detector_openvino_params.yaml -> the older profile that drives
#       the generic yolo_field_detector.py node with the same weights.
#   yolo_goalline_detector_params.yaml -> yolo_goalline_detector.py, which turns
#       the same model's goalposts into ONE goal line.
# All three can coexist; only this file belongs to yolo_landmark_detector.py.
#
# Applied via the "/**" wildcard so the values reach the node whatever
# namespace/name it is launched under.
/**:
  ros__parameters:
    # ---------------------------------------------------------------- model
    # An OpenVINO model is a DIRECTORY (.xml + .bin + metadata.yaml), not one
    # file. Relative paths resolve against the package share dir. This is the
    # folder as it comes out of landmark_deploy.zip — INT8, so the .bin is only
    # ~3.0 MB against the 12 MB of an FP32 export.
    model_path: "model/landmark_deploy/best_landmark_v8n_int8_openvino_model"

    # OpenVINO carries no task ultralytics detects reliably; set it explicitly.
    model_task: "detect"

    # Subscribe to a CompressedImage (true) or a raw Image (false) on image_in.
    use_compressed: true

    # ------------------------------------------------------------ inference
    confidence_threshold: 0.5
    iou_threshold: 0.45

    # MUST match the exported size. This IR's input is a STATIC [1,3,640,640],
    # so 640 — anything else is rejected by OpenVINO outright. Re-export the
    # model to change it.
    imgsz: 640

    # OpenVINO runs on the Intel CPU. INT8 precision is baked into this IR at
    # export time (quantize=8), not selected by the "half" flag.
    device: "cpu"
    half: false

    # A landmark frame can hold many boxes: junctions everywhere on the field.
    max_detections: 30

    # Which model class names to KEEP. Empty ([]) = every class, the usual
    # choice for a landmark feed. best_landmark_v8n exposes 5:
    #   0: L   1: T   2: X   3: goalpost   4: center_circle
    # To narrow it down, list exact names, e.g. ["goalpost", "center_circle"].
    target_classes: []

    # Inference loop rate (Hz). 640 px INT8 costs ~22 ms/frame on this CPU, so
    # the model can do ~35 FPS — but the ball detector and the walking
    # controller want the same cores, so 10 Hz is the polite default. The
    # start-up log states the real ceiling on your machine.
    detection_rate: 10.0

    # --------------------------------------------------------------- output
    # Annotated debug image on image_out. The overlay is only rendered while
    # somebody subscribes, so leaving this true costs nothing in a match.
    publish_image: true

    detection_frame_id: "detector"

    # Start detecting immediately, or wait for "enable" (std_msgs/Bool) = true.
    enable_at_start: true

    # ------------------------------------------------------- FPS reporting
    # Seconds between the live "FPS ... | L x2, goalpost x1" log lines. The
    # same rate is published continuously on the "fps" topic regardless.
    fps_log_period: 5.0

    # Length of the sliding window the live FPS is measured over (s).
    fps_window_sec: 2.0

    # Frames used at start-up to measure the model's FPS CEILING on this
    # machine (logged once, before any camera frame arrives). 0 disables it.
    startup_benchmark_frames: 5

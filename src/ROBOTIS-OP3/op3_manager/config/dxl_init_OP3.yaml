# Per-Dynamixel init values written by robotis_controller on boot.
#
# NOTE (startup speed): each EEPROM entry here costs one bus round-trip PER SERVO
# every boot (the controller reads it to diff-check, robotis_controller.cpp:395-416).
# On this robot a single round-trip is ~15 ms (OpenCR USB<->TTL bridge), so every
# redundant entry x20 servos adds up. operating_mode(3), max_position_limit(4095)
# and min_position_limit(0) are the XM430-W350 FACTORY DEFAULTS, so they were
# removed here — dropping them changes nothing functionally but skips 3 reads/servo.
# Kept: position gains (RAM, reset on power-off so must be set each boot),
# return_delay_time (1 != factory 250), and shutdown where non-default.
head_pan:
  position_d_gain: 0
  position_i_gain: 0
  position_p_gain: 800
  return_delay_time: 1
head_tilt:
  position_d_gain: 0
  position_i_gain: 0
  position_p_gain: 800
  return_delay_time: 1
l_ank_pitch:
  position_d_gain: 0
  position_i_gain: 0
  position_p_gain: 800
  return_delay_time: 1
l_ank_roll:
  position_d_gain: 0
  position_i_gain: 0
  position_p_gain: 800
  return_delay_time: 1
l_el:
  position_d_gain: 0
  position_i_gain: 0
  position_p_gain: 800
  return_delay_time: 1
  shutdown: 56

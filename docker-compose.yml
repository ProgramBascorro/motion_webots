services:
  op3_ros2:
    build: .
    container_name: op3_ros2_humble
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
      - ROS_DOMAIN_ID=0
    volumes:
      - ./src:/ros2_ws/src:rw
      - ./build:/ros2_ws/build:rw        # prebuilt workspace from host (symlink-install needs build+install together)
      - ./install:/ros2_ws/install:rw    # so ros2 run/launch find op3_* packages inside the container
      - ./log:/ros2_ws/log:rw
      - ./scripts/container_bashrc:/root/.bashrc:ro   # auto-source ROS + workspace in every `docker exec` shell
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:rw
      - /dev:/dev          # share host /dev so hot-plugged serial (FTDI ttyUSB) appears live
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true

# time parameter
#
# Turun 4.0 → 2.0 (2026-07-03) untuk mempercepat boot INIT. Di dalam container
# Docker non-RT loop kontrol base_module jalan ~45 Hz (bukan 125 Hz), jadi
# durasi wall-clock membengkak ~2.75×: mov_time 4.0 → gerak nyata ~11 s.
# Dengan 2.0, gerak nyata ~5.5 s — masih LEBIH LAMBAT dari desain 4.0 s di
# hardware RT, jadi kecepatan servo tetap aman (tidak menyentak).
mov_time : 2.0    # movement time

via_num : 0   # via-point number
via_time : [ 2.0 ] # via-point time


# via-point pose [deg]

via_pose :
  1 : [ 0.0 ]       # r_sho_pitch
  2 : [ 0.0 ]       # l_sho_pitch
  3 : [ -15.0 ]       # r_sho_roll
  4 : [ 15.0 ]       # l_sho_roll
  5 : [ 0.0 ]       # r_el
  6 : [ 0.0 ]       # l_el
  7 : [ 0.0 ]       # r_hip_yaw
  8 : [ 0.0 ]       # l_hip_yaw
  9 : [ 0.0 ]       # r_hip_roll
  10 : [ 0.0 ]      # l_hip_roll
  11 : [ 0.0 ]      # r_hip_pitch
  12 : [ 0.0 ]      # l_hip_pitch
  13 : [ 0.0 ]      # r_knee
  14 : [ 0.0 ]      # l_knee
  15 : [ 0.0 ]      # r_ank_pitch
  16 : [ 0.0 ]      # l_ank_pitch
  17 : [ 0.0 ]      # r_ank_roll
  18 : [ 0.0 ]      # l_ank_roll
  19 : [ 0.0 ]      # head_pan 
  20 : [ 0.0 ]      # head_tilt


# target pose [deg]
#
# DIBUAT OTOMATIS oleh scripts/sync_ini_pose_from_page2.py.
# Sumber: halaman 2 (WALKING_READY) step[0] dari
#   src/ROBOTIS-OP3/op3_action_module/data/ALPHONSE.bin
#
# JANGAN disunting tangan. Tiap kali halaman 2 di-teach ulang di action
# editor, jalankan ulang skrip itu -- kalau tidak, tombol INIT (base_module)
# dan boot demo (action_module) akan berdiri di pose yang berbeda.
#
# Konversi: derajat = (raw - 2048) * 360 / 4096.


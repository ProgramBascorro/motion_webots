/**:
  ros__parameters:
    video_device: "/dev/video0"
    framerate: 30.0
    # Turunkan resolusi untuk FPS lebih tinggi
    image_width: 640      # Dari 640 → 320
    image_height: 480     # Dari 480 → 240
    pixel_format: "yuyv"
    camera_frame_id: "camera"
    io_method: "mmap"
    
    # Disable calibration
    camera_name: ""
    camera_info_url: ""
    
    # Fix warna kuning - adjust white balance
    brightness: 150
    contrast: 160
    saturation: 140
    sharpness: 200
    gain: 50
    
    # White balance - FIX INI untuk warna yang benar
    white_balance_automatic: 1        # Auto white balance ON
    white_balance_temperature: 5000   # Daylight (4000-6500), coba 5000-5500
    
    # Atau disable auto dan set manual:
    # white_balance_automatic: 0      # Manual mode
    # white_balance_temperature: 5200 # Adjust hingga warna normal
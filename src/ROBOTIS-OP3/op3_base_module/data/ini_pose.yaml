  12 : -40.781250      # l_hip_pitch   (raw 1584)
  13 : -59.501953      # r_knee        (raw 1371)
  14 : 59.589844       # l_knee        (raw 2726)
  15 : -28.300781      # r_ank_pitch   (raw 1726)
  16 : 29.003906       # l_ank_pitch   (raw 2378)
  17 : 1.142578        # r_ank_roll    (raw 2061)

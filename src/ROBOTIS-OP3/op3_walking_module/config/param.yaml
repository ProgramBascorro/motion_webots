# Init Pose offsets: the neutral stance the gait oscillation is built around.
# Derived by scripts/walking_ready_fk.py --yaml <export of page 2> on 2026-08-11.
# The values before that (0.0030 / 0.0320 / 0.0380) came from the script's built-in
# snapshot, which still held Robot 0's calibration -- not this robot's page 2 -- so
# walking_module's IK neutral pose did not match the stance the robot boots into.
# Re-run that script whenever page 2 (WALKING_READY) is re-taught.
#
# Since 2026-08-14 these offsets are also visible while STANDING: with walking_module
# enabled but not started, the legs track the neutral stance of whatever offsets are
# current, rate limited to 25 deg/s. So publishing on /robotis/walking/set_params (the
# Apply button in Bascorro Studio) moves the robot right away, no "start" needed. Right
# after the capture the tracked pose equals the captured one exactly, so enabling the
# module still causes no jump.
#
# y_offset is the exception: computeNeutralLegAngle() leaves it out of the reference
# stance, so it survives walking_bias_ and is the one knob for foot separation *while
# walking* -- it does NOT move the robot while standing. It is 0 here on purpose: this
# robot's page 2 already stands splayed (hip_roll spread ~10.4 deg), and the FK-derived
# 0.0205 that used to sit here cancelled out completely against the neutral stance, so
# it never did anything. Keeping 0 reproduces today's gait exactly. Raise it only if the
# feet clip each other while stepping; extra gap is roughly y_offset + 6 mm.
#
# Units here are NOT the units the WalkingParam message carries, which is what
# Bascorro Studio's Walking tab shows: period_time is ms here / seconds there, and
# roll/pitch/yaw/hip_pitch/pelvis are degrees here / radians there. foot_height,
# swing_right_left and swing_top_down are z_move_amplitude, y_swap_amplitude and
# z_swap_amplitude there. Keep WALKING_DEFAULT_PARAMS in App.jsx and the fallbacks in
# WalkingModule::initialize() in step with this file -- they are what the operator sees
# before the first Load, and period_time was left at 750 ms in both of them for a while
# after this file went to 500.
#
# NOTE: sending "save" on /robotis/walking/command rewrites this file and drops comments.
x_offset: 0.0046
y_offset: 0.0
z_offset: 0.0408
roll_offset: 0
pitch_offset: 3.9992452331112465
yaw_offset: 0
hip_pitch_offset: 7.9984904662224929
period_time: 500
dsp_ratio: 0.349999994
step_forward_back_ratio: 0.25
foot_height: 0.0399999991
swing_right_left: 0.0199999996
swing_top_down: 0.00600000005
pelvis_offset: 3.0022988690251378
arm_swing_gain: 1.5
balance_hip_roll_gain: 0.349999994
balance_knee_gain: 0.400000006
balance_ankle_roll_gain: 0.699999988
balance_ankle_pitch_gain: 0.899999976
p_gain: 32
i_gain: 0
d_gain: 0
# --- PUTAR KANAN -------------------------------------------------------------
# Disalin dari Bascorro Studio 2026-09-04 (versi "Putar Kanan New",
# tersimpan 3/9/2026 23:24).
#
# BARU: angle_move_amplitude naik dari 0,0 ke +0,015 rad. turn_in tetap -0,09.
#
# Perhatikan: ini BUKAN cermin putar_kiri, dan sekarang makin jelas tidak.
# Operator menyetel keduanya sendiri-sendiri:
#
#             angle_move_amplitude   turn_in    y_move
#   KIRI            -0,070           +0,015     -29 mm
#   KANAN           +0,015           -0,090     +20 mm
#
# Jadi bukan cuma tandanya yang berbeda: besarnya pun tertukar peran (yang
# besar di kiri adalah angle, yang besar di kanan adalah turn_in), 4-6x lipat.
# JANGAN PERNAH "menurunkan" satu sisi dari sisi lainnya.
#
# CATATAN SALINAN: tangkapan layar putaran ini tidak sampai ke dasar panel
# "Bentuk Gait", jadi arm_swing_gain, pelvis_offset, hip_pitch_offset, dan
# d_gain di bawah masih nilai salinan sebelumnya (0,0 / 0,05 / 0,14 / 0) --
# sama dengan keempat preset lain. Kalau di Studio ternyata beda, kirim
# tangkapan layar bagian bawahnya.
putar_kanan:
  init_x_offset: -0.022
  init_y_offset: 0.028
  init_z_offset: 0.0408
  init_roll_offset: 0.0
  init_pitch_offset: -0.18
  init_yaw_offset: 0.0

  period_time: 0.57
  dsp_ratio: 0.4
  step_fb_ratio: 0.25
  soft_start_time: 0.005

  x_move_amplitude: 0.0
  y_move_amplitude: 0.02
  z_move_amplitude: 0.037
  angle_move_amplitude: 0.015
  angle_move_amplitude_turn_in: -0.09
  move_aim_on: false

  balance_enable: false
  balance_hip_roll_gain: 0.35
  balance_knee_gain: 0.4
  balance_ankle_roll_gain: 0.7
  balance_ankle_pitch_gain: 0.9

  y_swap_amplitude: 0.0021
  z_swap_amplitude: 0.0
  arm_swing_gain: 0.0
  pelvis_offset: 0.05
  hip_pitch_offset: 0.14


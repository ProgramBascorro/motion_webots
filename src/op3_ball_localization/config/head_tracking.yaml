head_tracking_node:
  ros__parameters:
    # Direct YOLO center tracking
    ball_center_topic: /vision/yolo/ball_center

    # PID gains based on the original OP3 tracker
    p_gain: 0.30
    i_gain: 0.0
    d_gain: 0.045

    # Ignore corrections while the ball sits within this fraction of the frame
    # from center (e.g., 0.10 = inner 20% square). Prevents the camera from
    # hunting when YOLO's bbox center jitters frame-to-frame.
    center_deadzone: 0.10

    # Exponential smoothing on the ball center. 1.0 = no smoothing (raw YOLO),
    # lower = more smoothing but more lag. 0.4 keeps the response snappy while
    # rejecting single-frame noise.
    input_smoothing: 0.4

    # Control loop
    control_rate: 20.0
    lost_timeout: 0.8

    # When no ball is seen, sweep the head through forward + downward positions.
    # Up-facing angles are intentionally excluded — the ball sits on the floor.
    scan_enabled: true
    scan_period_sec: 1.8           # seconds per position (move + focus dwell) — a bit faster
    # 90 derajat kiri dan kanan dari tengah (tengah = 0). Pasangan posisi
    # "forward" memakai +-p penuh, pasangan "down" memakai +-0,7p.
    # CATATAN: head_control_module memotong head_pan di +-85 derajat, jadi
    # yang benar-benar tercapai adalah +-85, simetris kiri-kanan.
    scan_pan_rad: 1.5708           # 90 derajat
    # NOTE on this robot the head_tilt sign for the absolute scan command is
    # POSITIVE = look DOWN (negative pointed the head UP). Keep these positive.
    # Dua ketinggian searching, dari sudut SERVO yang diukur operator (skala
    # 0-360 derajat = raw x 360/4096). Dikonversi seperti robotis_framework
    # untuk XM430-W350 (raw 2048 = 0 rad, raw 4095 = +pi; offset head_tilt = 0):
    #   sendi = (raw - 2048) * pi / 2047
    #   servo 210 derajat = raw 2389 -> +30,0 derajat sendi (0,5238 rad)  NORMAL
    #   servo 230 derajat = raw 2617 -> +50,0 derajat sendi (0,8733 rad)  MENUNDUK
    # Positif = menunduk di robot ini.
    scan_tilt_forward_rad: 0.5238  # servo 210 derajat
    scan_tilt_down_rad: 1.0128     # servo 238 derajat
    # Salinan batas keras head_tilt di head_control_module, dipakai untuk cek
    # "kepala sudah sampai". Ikut modulnya: kini +58,03 derajat = servo 238,
    # dinaikkan supaya sapuan bawah 238 tidak dipotong.
    head_tilt_max_rad: 1.0128      # +58,03 derajat (servo 238)

    # OBSERVING MODE KIPER (sumber "gk" = D58 mode kiper, operator 2026-11-08).
    # Tilt dari kalibrasi jarak (scripts/calib_jarak_kamera.py): +12 deg sendi =
    # servo 20 ~192 memuat bola ~0,45-4,2 m sekaligus. Scan tengah -> kiri ->
    # tengah -> kanan, selalu mulai dari tengah; arah terakhir ditahan dulu.
    gk_scan_tilt_rad: 0.2094       # +12 derajat (servo 192)
    gk_scan_pan_rad: 0.6109        # 35 derajat (kamera sendiri +-33 deg)
    gk_lost_timeout: 1.5
    gk_scan_period_sec: 1.2

    # Camera field of view copied from the original tracker
    fov_width_deg: 35.2
    fov_height_deg: 21.6

    # Command shaping
    min_command_deg: 1.0
    max_offset_pan_rad: 0.25
    max_offset_tilt_rad: 0.20
    head_enable_retry_sec: 1.5
    # Only retry the enable_ctrl_module handshake during this initial window.
    # After that, stop — otherwise each re-enable resets the head's scan_state_.
    head_enable_boot_sec: 5.0

    # Sign multipliers — set to -1.0 to invert a direction if head moves wrong way
    pan_sign: 1.0
    tilt_sign: -1.0

    # Joint Names
    head_pan_joint: head_pan
    head_tilt_joint: head_tilt
    head_module_name: head_control_module

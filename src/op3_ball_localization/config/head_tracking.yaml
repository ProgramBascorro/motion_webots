head_tracking_node:
  ros__parameters:
    # Direct YOLO center tracking
    ball_center_topic: /vision/yolo/ball_center

    # PID gains based on the original OP3 tracker
    p_gain: 0.30
    i_gain: 0.0
    d_gain: 0.045

    # Ignore corrections while the ball sits within this fraction of the frame
    # from center (e.g., 0.10 = inner 20% square). Prevents the camera from
    # hunting when YOLO's bbox center jitters frame-to-frame.
    center_deadzone: 0.10

    # Exponential smoothing on the ball center. 1.0 = no smoothing (raw YOLO),
    # lower = more smoothing but more lag. 0.4 keeps the response snappy while
    # rejecting single-frame noise.
    input_smoothing: 0.4

    # Control loop
    control_rate: 20.0
    lost_timeout: 0.8
    # Sesudah bola terkunci, kepala DITAHAN diam (tidak menyapu) sampai
    # deteksinya hilang selama ini. Harus lebih besar dari lost_timeout.
    # Naikkan kalau bola sering tertutup kaki lawan; turunkan kalau kepala
    # terasa terlalu lama mematung sesudah bolanya benar-benar pergi.
    lock_hold_sec: 2.0

    # When no ball is seen, sweep the head through forward + downward positions.
    # Up-facing angles are intentionally excluded — the ball sits on the floor.
    scan_enabled: true
    scan_period_sec: 1.8           # seconds per position (move + focus dwell) — a bit faster
    scan_pan_rad: 0.7              # pan amplitude at extremes (~40°)
    # NOTE on this robot the head_tilt sign for the absolute scan command is
    # POSITIVE = look DOWN (negative pointed the head UP). Keep these positive.
    # Kedua sudut ini DINAIKKAN 2026-08-25 (0,25 -> 0,12 dan 0,55 -> 0,40)
    # karena kepala terlalu menunduk. Dengan setengah-FOV tegak 21,6 deg dan
    # kamera di ketinggian ~40 cm, sudut tunduk d menaruh titik pusat pandang
    # di jarak 0,4/tan(d):
    #   baris depan  +14,3 deg -> pusat ~1,6 m   ||  +6,9 deg -> pusat ~3,3 m
    #   baris bawah  +31,5 deg -> pusat ~0,65 m  || +22,9 deg -> pusat ~0,95 m
    # Nilai lama membuat tepi bawah bingkai jatuh di 53 deg = ~0,30 m, yaitu
    # kaki robot sendiri. Nilai baru masih menutup lantai mulai ~0,5 m tapi
    # tidak lagi membuang setengah bingkai untuk memandangi kakinya.
    scan_tilt_forward_rad: 0.12    # forward tilt (~+7°, memandang jauh ke depan)
    scan_tilt_down_rad: 0.40       # down tilt (~+23°, memandang lantai di depan kaki)

    # Camera field of view copied from the original tracker
    fov_width_deg: 35.2
    fov_height_deg: 21.6

    # Command shaping
    min_command_deg: 1.0
    max_offset_pan_rad: 0.25
    max_offset_tilt_rad: 0.20
    head_enable_retry_sec: 1.5
    # Only retry the enable_ctrl_module handshake during this initial window.
    # After that, stop — otherwise each re-enable resets the head's scan_state_.
    head_enable_boot_sec: 5.0

    # Sign multipliers — set to -1.0 to invert a direction if head moves wrong way
    pan_sign: 1.0
    tilt_sign: -1.0

    # Joint Names
    head_pan_joint: head_pan
    head_tilt_joint: head_tilt
    head_module_name: head_control_module

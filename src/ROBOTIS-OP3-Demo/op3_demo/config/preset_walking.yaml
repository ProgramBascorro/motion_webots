# --- GESER KIRI --------------------------------------------------------------
# Disalin dari Bascorro Studio 2026-09-02 (versi "KIRI MIN NEW").
#
# Dipakai sesudah yaw lurus, waktu robot menyesuaikan posisi kaki dengan bola:
# bola ada di sebelah KIRI kaki yang dituju, jadi robot bergeser ke kiri sampai
# bolanya masuk jendela tendang.
#
# Preset ini membawa angle_move_amplitude 0.1 rad (~5,7 deg), jadi ia ikut
# MEMUTAR badan sedikit, bukan menggeser murni. Itu setelan operator dan
# dipakai apa adanya; toleransi yaw +-15 deg memang cukup lebar untuk itu.
geser_kiri:
  # init_x_offset SENGAJA TIDAK diambil dari Studio (2026-09-08).
  #
  # KIRI MIN NEW dan KANAN MIN NEW yang tersimpan di Bascorro Studio memakai
  # init_x_offset -0.18, dan angka itu MUSTAHIL secara mekanis: kaki jadi
  # diminta 254,1 mm dari pinggul padahal paha + betis cuma 220,2 mm. Diuji
  # langsung terhadap op3_kinematics_dynamics, IK gagal di seluruh rentang
  # langkahnya, sementara kelima preset lain lolos.
  #
  # Itu bukan dugaan: inilah yang membuat log membanjir
  # "IK produced non-finite leg_angle[2]" pada 2026-09-08 dini hari, dan
  # waktunya cocok persis. KANAN MIN NEW disimpan 02:06:52, walking_module
  # dinyalakan 02:07:53, galat IK mulai 02:08:41 dan tidak berhenti.
  #
  # Dibiarkan di -0.03 (nilai lama yang terbukti jalan) sampai operator
  # memastikan angkanya. Dugaan kuat maksudnya -0.018, sama dengan
  # mencari_celah; itu terjangkau (180,3 mm) dan pola angkanya cocok.
  init_x_offset: -0.03
  init_y_offset: 0.028
  init_z_offset: 0.0408
  init_roll_offset: 0.0
  init_pitch_offset: -0.28
  init_yaw_offset: 0.0

  period_time: 0.55
  dsp_ratio: 0.4
  step_fb_ratio: 0.25
  soft_start_time: 0.01

  x_move_amplitude: -0.0026
  y_move_amplitude: -0.025
  z_move_amplitude: 0.037
  angle_move_amplitude: 0.1
  angle_move_amplitude_turn_in: 0.0
  move_aim_on: false

  balance_enable: false
  balance_hip_roll_gain: 0.35
  balance_knee_gain: 0.4
  balance_ankle_roll_gain: 0.7
  balance_ankle_pitch_gain: 0.9

  y_swap_amplitude: 0.0021
  z_swap_amplitude: 0.0
  arm_swing_gain: 0.0
  pelvis_offset: 0.05
  hip_pitch_offset: 0.14

  p_gain: 16
  i_gain: 0
  d_gain: 0


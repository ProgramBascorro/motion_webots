head_tracking_node:
  ros__parameters:
    # PID Control Gains (reduced for smoother, less jerky tracking)
    p_gain: 0.35            # Reduced from 0.65 - less aggressive
    d_gain: 0.10            # Increased from 0.08 - more damping

    # Scanning Parameters (slower and safer range)
    scan_enabled: true
    scan_pan_min: -0.9      # Reduced from -1.2 to avoid servo limits
    scan_pan_max: 0.9       # Reduced from 1.2 to avoid servo limits
    scan_tilt_down: -0.5    # Reduced from -0.6 to avoid servo limits
    scan_tilt_up: -0.2      # Reduced from -0.25 for better view
    scan_step: 0.15         # Smaller step for smoother scan (was 0.2)
    scan_dwell_sec: 1.5     # Longer pause at each position (was 0.8)

    # Detection Parameters (much longer timeout to keep tracking stable)
    lost_timeout: 4.0       # Much longer timeout (was 2.5) - stay in tracking mode longer
    min_ball_radius: 0.005  # Lower threshold to detect smaller balls (was 0.01)

    # Joint Names
    head_pan_joint: head_pan
    head_tilt_joint: head_tilt
    head_module_name: head_control_module

    # Control Rate
    control_rate: 10.0      # Hz

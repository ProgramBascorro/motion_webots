head_tracking_node:
  ros__parameters:
    # Direct YOLO center tracking
    ball_center_topic: /vision/yolo/ball_center

    # PID gains based on the original OP3 tracker
    p_gain: 0.30
    i_gain: 0.0
    d_gain: 0.045

    # Ignore corrections while the ball sits within this fraction of the frame
    # from center (e.g., 0.10 = inner 20% square). Prevents the camera from
    # hunting when YOLO's bbox center jitters frame-to-frame.
    center_deadzone: 0.10

    # Exponential smoothing on the ball center. 1.0 = no smoothing (raw YOLO),
    # lower = more smoothing but more lag. 0.4 keeps the response snappy while
    # rejecting single-frame noise.
    input_smoothing: 0.4

    # Control loop
    control_rate: 20.0
    lost_timeout: 0.8
    # Sesudah bola terkunci, kepala DITAHAN diam (tidak menyapu) sampai
    # deteksinya hilang selama ini. Harus lebih besar dari lost_timeout.
    # Naikkan kalau bola sering tertutup kaki lawan; turunkan kalau kepala
    # terasa terlalu lama mematung sesudah bolanya benar-benar pergi.
    lock_hold_sec: 2.0

    # POLA SAPUAN, searah keliling dan DIAWALI MENUNDUK KE DEPAN (permintaan
    # operator 2026-09-04). head_tilt POSITIF = MENUNDUK (diverifikasi
    # 2026-09-15, lihat scan_tilt_down_rad):
    #
    #   1. (pan   0, tilt +25,2)  <- awal: lantai tepat di depan kaki = BATAS BAWAH
    #   2. (pan -55, tilt  -6,9)  <- BATAS ATAS
    #   3. (pan -55, tilt  -6,9)  <- sasaran SAMA: kepala DIAM di sini
    #   4. (pan +55, tilt  -6,9)
    #   5. (pan +55, tilt  -6,9)  <- sasaran SAMA -> balik ke 1
    #
    # Urutan ini BUKAN sekadar selera. Sasaran pan +-55 harus bertahan DUA
    # langkah berturut-turut (titik 2-3 dan 4-5), kalau tidak kepala diperintah
    # pergi sebelum sampai -- lihat tabel waktu di scan_period_sec.
    #
    # 2026-09-08: titik 3 dan 4 DULU menengadah (-26,9 deg) dan itu yang bikin
    # bola "tidak ke-detect-detect" -- lihat scan_tilt_upper_rad. Sejak itu
    # keempat titik ujung memakai sudut yang sama, jadi langkah 2->3 dan 4->5
    # tidak menggerakkan kepala sama sekali: jadi waktu DIAM, dan frame yang
    # diam itulah yang paling mudah dikenali YOLO.
    scan_enabled: true
    # Satu titik sapuan per periode ini. Diturunkan 1,8 -> 1,6 bersamaan dengan
    # angle_unit 30 -> 35 deg/s di op3_manager.launch.py: KEDUANYA harus naik
    # bersama. Menaikkan angle_unit saja cuma membuat kepala sampai lebih cepat
    # lalu MENUNGGU sisa periodenya -- terukur diam malah naik 32,2 -> 35,2 %.
    # Simulasi trajektori modul (min-jerk, 8 ms), pola dan tilt saat ini:
    #   30 deg/s + 1,8 s : diam 32,2 %  laju 21,3  puncak 56,2  pan -40..+33,5
    #   35 deg/s + 1,8 s : diam 35,2 %  laju 22,7  puncak 65,6  pan -40..+39,3
    #   35 deg/s + 1,6 s : diam 30,2 %  laju 24,7  puncak 65,6  pan -40..+36,3  <- dipakai
    # Jadi +16 % laju rata-rata, +17 % puncak, satu putaran penuh 7,2 -> 6,4 s,
    # dan jangkauannya justru melebar. Puncak 65,6 deg/s masih di bawah ~74
    # deg/s, titik saat gambar mulai buram buat YOLO.
    #
    # 2026-09-04: 1,6 -> 2,2 s, DIPAKSA oleh pelebaran pan di bawah. Kepala
    # tidak bisa menempuh 150 derajat dalam waktu yang lama:
    #   moving_time = MAX(1,0 ; |delta| / angle_unit) = 150/35 = 4,29 s
    # sementara satu sasaran pan bertahan dua langkah sapuan, yaitu 2 x periode.
    # Dengan 1,6 s cuma tersedia 3,20 s -- kepala DIPERINTAH ke sasaran
    # berikutnya sebelum sampai, jadi sapuannya tidak pernah benar-benar
    # menyentuh +-75 dan lebarnya cuma sekitar 124 derajat. Dengan 2,2 s
    # tersedia 4,40 s dan sasarannya tercapai.
    #
    #   periode  tersedia  butuh   sampai?  diam   1 putaran (5 titik)
    #    1,6 s    3,20 s   4,29 s  TIDAK      0 %    8,0 s   <- sebelumnya
    #    2,2 s    4,40 s   4,29 s  ya         3 %   11,0 s   <- dipakai
    #    2,6 s    5,20 s   4,29 s  ya        18 %   13,0 s
    #    3,0 s    6,00 s   4,29 s  ya        29 %   15,0 s
    #
    # Dipilih yang paling cepat yang masih SAMPAI. Kalau ternyata YOLO sering
    # kehilangan bola karena kepala nyaris tidak pernah berhenti, naikkan ke
    # 2,6 atau 3,0 -- itu menukar kecepatan putaran dengan waktu diam.
    #
    # angle_unit TIDAK perlu dinaikkan: puncak laju min-jerk = 1,875 x
    # angle_unit = 65,6 deg/s, dan angka itu TIDAK bergantung pada jarak
    # tempuh. Jadi sapuan yang lebih lebar tidak membuat gambar lebih buram --
    # ia cuma butuh waktu lebih lama. Menaikkan angle_unit justru mendekatkan
    # puncaknya ke langit-langit buram ~74 deg/s.
    #
    # 2026-09-08: 2,2 -> 1,7 s bersama penyempitan pan 75 -> 55 deg, atas
    # laporan operator "terlalu lama, malah tidak ke-detect-detect".
    #
    # angle_unit SENGAJA TIDAK dinaikkan, jadi laju puncak kepala TETAP
    # 65,6 deg/s -- ketajaman gambarnya sama persis seperti sebelumnya. Yang
    # dipercepat cuma seberapa sering satu titik ditengok ulang, dan itu
    # didapat dari jarak tempuh yang lebih pendek, bukan dari kepala yang
    # digeber. Menaikkan angle_unit justru mendekatkan puncaknya ke ~74 deg/s,
    # titik saat gambar mulai buram buat YOLO.
    #
    # Syarat yang harus dipenuhi periode baru, dua-duanya:
    #   a. lintasan terpanjang (110 deg, titik 3->4) dapat DUA periode:
    #      2 x 1,7 = 3,40 s >= 110/35 = 3,14 s  ya
    #   b. satu putaran cukup untuk semua geraknya:
    #      5 x 1,7 = 8,50 s >= 1,57 + 0 + 3,14 + 0 + 1,57 = 6,29 s  ya
    #
    # Hasilnya, dibanding setelan lama:
    #                              lama (75 deg, 2,2 s)   baru (55 deg, 1,7 s)
    #   satu putaran penuh              11,0 s                 8,5 s
    #   waktu melihat LANTAI             ~61 %                  100 %
    #   waktu kepala DIAM (tajam)          3 %                   26 %
    #   laju puncak kepala              65,6 deg/s            65,6 deg/s
    #
    # Kalau bolanya masih sering lewat, percepat lagi dengan MENYEMPITKAN pan,
    # bukan dengan memperpendek periode sendirian -- periode harus selalu
    # >= pan_deg/35 supaya syarat (a) tetap terpenuhi:
    #   pan +-50 -> periode 1,55 s -> putaran 7,8 s
    #   pan +-45 -> periode 1,40 s -> putaran 7,0 s
    scan_period_sec: 1.7
    # LEBAR SAPUAN MENDATAR. 0,7 rad (40 deg) -> 1,309 rad (75 deg) atas
    # permintaan operator 2026-09-04: sapuan kiri-kanan sekarang 75 deg ke kiri
    # dan 75 deg ke kanan dengan titik tengah 0, jadi satu putaran penuh
    # menyapu 150 derajat.
    #
    # Batas sendi head_pan di head_control_module +-85 deg, jadi 75 masih di
    # dalam dengan sisa 10 deg. Jangan naikkan sampai 85: modul akan menjepit
    # perintahnya diam-diam dan sudut sapuan jadi tidak seperti yang tertulis.
    #
    # 2026-09-08: 1,309 rad (75 deg) -> 0,9599 rad (55 deg), jadi satu putaran
    # menyapu 110 derajat, bukan 150.
    #
    # Alasannya bukan sekadar mengejar waktu. Sapuan ini cuma dipakai saat bola
    # TIDAK terlihat, dan di keadaan itu BADAN robot sedang berputar di tempat
    # memakai preset MENCARI CELAH. Jadi arah pandang yang lebar sudah
    # disediakan badannya; kepala yang ikut menyapu 150 derajat di atas badan
    # yang berputar cuma menambah waktu tempuh tanpa menambah cakupan.
    #
    # Batas sendi head_pan di head_control_module +-85 deg, jadi 55 masih jauh
    # di dalam. Kembalikan ke 1.309 kalau memang mau 150 derajat lagi -- tapi
    # naikkan scan_period_sec ke 2,2 barengan, kalau tidak kepala diperintah
    # pergi sebelum sampai dan sapuannya justru menyempit sendiri jadi ~124 deg.
    scan_pan_rad: 0.9599           # pan amplitude at extremes (55 deg)

    # Baris BAWAH dulu sengaja lebih sempit (0,7 x lebar) supaya kamera melihat
    # di antara kedua kaki. Sejak 2026-09-04 dibuat 1,0 supaya sapuannya
    # benar-benar 150 derajat penuh seperti yang diminta, bukan 105 derajat di
    # baris bawah. Turunkan lagi ke 0.7 kalau bola dekat kaki jadi sering
    # terlewat.
    scan_pan_down_ratio: 1.0

    # ARAH head_tilt DI ROBOT INI: POSITIF = MENUNDUK, NEGATIF = MENDONGAK.
    # Diverifikasi 2026-09-15 dalam SATU run, kepala saja (pan 0, badan diam,
    # pelacak INACTIVE): perintah absolut -0,12 / +0,1745 / +0,4391 rad, satu
    # frame kamera tiap sudut sesudah head_tilt terbaca -6,5 / +10,1 / +25,3 deg.
    # Pemandangannya bergeser dari lantai 2-3 m di depan ke lantai tepat di
    # depan kaki (tangan robot sendiri masuk bingkai). Offset head_tilt di
    # offset.yaml NOL, jadi derajat servo 20 = 180 + sudut ini.
    #
    #   BATAS BAWAH sapuan = angka TERBESAR = scan_tilt_down_rad  (titik depan)
    #   BATAS ATAS  sapuan = angka TERKECIL = scan_tilt_upper_rad (ujung pan)
    #
    # Riwayat batas BAWAH (titik depan, pan 0):
    #   2026-08-25  0,55 -> 0,40 -> 0,26 -> 0,09 rad, dinaikkan tiga kali
    #   2026-09-04  0,09 -> 0,4391 rad (+5,2 -> +25,2 deg) atas permintaan
    #               operator, supaya bola di dekat kaki ikut ketemu
    # Batas sendi head_tilt di head_control_module -30 .. +75 deg.
    scan_tilt_down_rad: 0.4391       # BATAS BAWAH: +25,2 deg, servo 20 205,2 deg

    # BATAS ATAS sapuan, dipakai keempat titik ujung pan (+-55 deg). Ubah angka
    # INI SAJA untuk mengatur seberapa tinggi kepala melihat saat menyapu:
    #   lebih tinggi / lebih jauh ke depan -> KURANGI angkanya
    #   lebih rendah                       -> TAMBAH angkanya
    # Rentang yang diterima node: -0,5061 rad (-29,0 deg, servo 20 151,0 deg)
    # sampai scan_tilt_down_rad. -29,0 deg masih di dalam sudut yang sudah
    # terbukti dicapai kepala (servo 20 terbaca 150,8 deg = -29,2 deg di pose
    # INIT D58 2026-09-15); head_control_module sendiri menjepit di -30 deg.
    # Angka di luar rentang dijepit dan dicatat ERROR di log head_tracking_node.
    #
    # 2026-09-15: +0,1745 -> -0,12 rad (+10,0 -> -6,9 deg; servo 20 190,0 ->
    # 173,1 deg) atas laporan operator "kepala terlalu menunduk saat scanning
    # bersama MENCARI CELAH". Menggantikan scan_tilt_forward_rad dan
    # scan_tilt_down_side_rad, yang keduanya 0,1745 dan memang harus sama.
    # Kenapa -0,12:
    #   - angka itu sudah ada di konfigurasi ini: pose istirahat
    #     scan_neutral_tilt_rad, dan baris depan sapuan s/d 2026-09-03;
    #   - frame 2026-09-15 pada -6,5 deg masih berisi LANTAI sampai tepi atas
    #     bingkai (orang yang duduk di lantai 2-3 m terpotong setinggi dada),
    #     jadi tepi atasnya sudah dekat cakrawala. Naik jauh lebih tinggi mulai
    #     membuang bingkai ke dinding -- pelajaran 2026-09-08, saat -26,9 deg
    #     menghabiskan 39 % tiap putaran menyapu langit.
    # Waktu sapuan TIDAK berubah: gerak titik depan <-> ujung tetap ditentukan
    # pan 55 deg (55/35 = 1,57 s); tilt kini 32,0 deg (0,92 s). Yang berubah
    # cuma laju puncak tilt di lintasan miring itu, 18 -> 38 deg/s. Waktu diam
    # di ujung pan sama.
    # JANGAN mengisinya lebih MENUNDUK dari +0,1745 (+10 deg): di ujung pan,
    # tunduk dalam membuat BAHU robot masuk bingkai (laporan 2026-09-04).
    scan_tilt_upper_rad: -0.12       # BATAS ATAS: -6,9 deg, servo 20 173,1 deg

    # Pose istirahat sesudah perintah "stop". Terpisah dari sudut sapuan supaya
    # mengubah sapuan tidak ikut memindahkan pose istirahat kepala.
    scan_neutral_tilt_rad: -0.12

    # Camera field of view copied from the original tracker
    fov_width_deg: 35.2
    fov_height_deg: 21.6

    # Command shaping
    min_command_deg: 1.0
    max_offset_pan_rad: 0.25
    max_offset_tilt_rad: 0.20
    head_enable_retry_sec: 1.5
    # Only retry the enable_ctrl_module handshake during this initial window.
    # After that, stop — otherwise each re-enable resets the head's scan_state_.
    head_enable_boot_sec: 5.0

    # Sign multipliers — set to -1.0 to invert a direction if head moves wrong way
    pan_sign: 1.0
    tilt_sign: -1.0

    # =====================================================================
    # SAPUAN 7 TAHAP (17 Sep 2026) -- HANYA D60. D56 dan D58 tetap memakai
    # titik sapuan lama di atas (scan_mode "legacy"). D60 memilih mode ini
    # dengan perintah "scan_stages" di /ball_tracker/command sebelum "start",
    # dan mengembalikan "scan_legacy" saat berhenti.
    scan_mode: legacy
    #
    # Satuan: servo 19 dalam PERSEN (0 = paling kiri = head_pan +85 deg,
    # 100 = paling kanan = -85 deg, 50 = lurus), servo 20 dalam DERAJAT SERVO
    # (180 = lurus, lebih besar = MENUNDUK). Konversi yang sama dengan D58/D60.
    #
    # Mulai dari (50 %, 207) lalu siklus:
    #   1 (70 %, 207)  2 (100 %, 180)  3 (100 %, 135)  4 (0 %, 135)
    #   5 (0 %, 180)   6 (30 %, 207)   7 (50 %, 207)  -> kembali ke 1
    # Setiap tahap: interpolasi linier kedua servo bersamaan, lamanya = sumbu
    # terjauh / scan_speed_deg_s, TANPA jeda diam; setpoint dikirim sebagai
    # offset 20 Hz ke head_control_module. Batas menunduk mengikuti pan
    # (207 di tengah, 180 di ujung) dijaga head_control_module (amplop).
    #
    # Catatan penerjemahan permintaan operator: "70 derajat" pada tahap 1
    # dibaca 70 PERSEN (arah sapuan 50 -> 70 -> 100 konsisten; 70 deg sendi =
    # 8,8 % justru berlawanan arah), dan "0 %" servo 20 pada tahap 2 dibaca
    # 180 deg (batas menunduk di ujung 100 %, simetris dengan tahap 5).
    scan_pan_left_limit_deg: 85.0
    scan_pan_right_limit_deg: -85.0
    scan_start_pan_percent: 50.0
    # 19 Sep 2026: 207 -> 210 (butuh amplop tengah 30 deg di op3_manager.launch.py).
    scan_start_tilt_servo_deg: 210.0
    # Pra-awal: pertama kali / sesudah halaman action kepala ke (50 %, 180) dulu,
    # baru perlahan (laju sama) ke (50 %, 207), baru siklus tahap 1..7.
    scan_prestart_tilt_servo_deg: 180.0
    # Mode "walk" (D60 SEARCH_BALL: bola TIDAK terdeteksi + badan MENCARI CELAH):
    # servo 20 tetap 169, servo 19 bolak-balik 0 % <-> 100 %, laju scan_speed_deg_s.
    scan_walk_percent_servo: [0.0, 169.0, 100.0, 169.0]
    # Mode "hold" (D60, 19 Sep 2026): diam pertama sesudah D60 ditekan, kepala ditahan
    # di (50 %, servo 20 135) tanpa menyapu; bola terdeteksi = langsung dilacak.
    scan_hold_percent_servo: [50.0, 135.0]
    # 19 Sep 2026: 10 langkah (kanan -> tengah menunduk -> kiri -> tengah menunduk), laju sama, tanpa jeda.
    scan_stages_percent_servo: [70.0, 207.0, 100.0, 180.0, 100.0, 135.0, 50.0, 135.0, 50.0, 207.0, 30.0, 207.0, 0.0, 180.0, 0.0, 135.0, 50.0, 135.0, 50.0, 207.0]
    scan_speed_deg_s: 30.0
    scan_min_stage_sec: 0.2

    # Pose PARKIR sesudah perintah "stop" = posisi kepala saat halaman action
    # (tendang/bangun) dimulai: servo 19 di 0 deg sendi (50 %), servo 20 200.
    park_pan_deg: 0.0
    park_tilt_servo_deg: 200.0

    # Joint Names
    head_pan_joint: head_pan
    head_tilt_joint: head_tilt
    head_module_name: head_control_module

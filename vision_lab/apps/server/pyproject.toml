[project]
name = "bascorro-studio-vision-lab-server"
version = "0.1.0"
description = "FastAPI backend for Bascorro Studio Vision Lab"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "pydantic>=2.9,<3.0",
  "numpy>=1.26,<3.0",
  "opencv-python>=4.10,<5.0",
  "onnxruntime>=1.20,<2.0",
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0"
]

[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

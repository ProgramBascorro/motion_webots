# DIKEMBALIKAN 2026-09-06 ke isi 3 September 2026 (akhir hari, WIB), atas
# permintaan operator: "batalkan semua perubahan yang telah terjadi setelah
# tanggal 3 September".
#
# Isinya = preset Bascorro Studio "dari ketua" (tersimpan 2026-08-18, disalin
# ke sini 2026-08-22). Itulah keadaan berkas ini sepanjang 22 Agustus sampai
# 3 September.
#
# TIGA SAKLAR DICABUT, kunci di sini MAUPUN kodenya di op3_walking_module:
#
#   walking_bias_enable     (dipasang 2026-09-04)
#   soft_start_enable       (dipasang 2026-09-06)
#   first_step_half_enable  (dipasang 2026-09-06)
#
# Ikut dicabut: seluruh perbaikan soft start 5-6 September (softStartActive(),
# pelepasan ramp saat Apply, penjagaan di timeRampScale/startWalking), dan
# checkPoseReference()/restorePoseReference() di op3_demo/ball_follower.
# Jadi walking_module dan ball_follower kembali ke perilaku 3 September:
# walking_bias_ selalu hidup, soft start apa adanya, langkah pertama dipotong
# setengah, dan tidak ada snapshot acuan pose antar run.
#
# YANG DIBATALKAN DIBANDING KEADAAN 6 SEPTEMBER:
#   x_offset          -0.02   (sempat -0.03)
#   pitch_offset      -4.0107 (sempat -6.8755)
#   hip_pitch_offset   7.9985 (sempat  8.0214)
#   period_time        800    (sempat  770)
#   dsp_ratio          0.58   (sempat  0.4)
#   step_fb_ratio      0.2    (sempat  0.25)
#   soft_start_time    2000   (sempat  50)
#   swing_right_left  -0.002  (sempat  0.0021)
#   swing_top_down     0.006  (sempat  0)
#   pelvis_offset      3.0023 (sempat  2.8648)
#   p_gain             36     (sempat  16)
#
# AKIBAT YANG PERLU DIINGAT. Berkas ini adalah TITIK ACUAN perekaman
# walking_bias_, bukan salinan preset:
#
#     pose robot = page 2 + [ neutral(preset yang hidup) - neutral(berkas ini) ]
#
# Karena isinya kembali berbeda dengan preset JALAN KE SURGA, init pose preset
# itu terasa lagi di robot: x -10,0 mm, pitch -2,8648 deg, hip_pitch +0,0229
# deg terhadap pose page 2. Itu memang keadaan 3 September.
#
# SATUANNYA BEDA dengan Bascorro Studio: di sini DERAJAT dan MILIDETIK, di sana
# radian dan detik. loadWalkingParam() yang mengalikan DEGREE2RADIAN dan 0,001.
# Nama kuncinya juga beda: foot_height / swing_right_left / swing_top_down =
# z_move_amplitude / y_swap_amplitude / z_swap_amplitude, dan
# step_forward_back_ratio = step_fb_ratio.
#
# walking_module membaca berkas ini SEKALI saat boot, jadi sesudah diubah
# op3_manager harus dijalankan ulang. Demo menimpa x/y/angle move amplitude di
# atasnya lewat preset dan ramp-nya sendiri.
#
# Jaga WALKING_DEFAULT_PARAMS di bascorro_studio/web/src/App.jsx tetap seirama
# dengan berkas ini -- itu yang dilihat operator sebelum menekan Load.
#
# NOTE: sending "save" on /robotis/walking/command rewrites this file and drops comments.
x_offset: -0.02
y_offset: 0.028
z_offset: 0.0408
roll_offset: 0
pitch_offset: -4.010704565915763
yaw_offset: 0
hip_pitch_offset: 7.9984904662224929
period_time: 800
dsp_ratio: 0.58
step_forward_back_ratio: 0.2
soft_start_time: 2000
foot_height: 0.037
swing_right_left: -0.002
swing_top_down: 0.006
pelvis_offset: 3.0022988690251378
arm_swing_gain: 0
# Balance (IMU) mati di preset "dari ketua". Kunci ini dipasang 2026-08-22
# (sebelum 3 September, jadi TETAP): sebelumnya balance_enable tidak pernah
# dibaca dari yaml sama sekali, jadi mematikannya lewat Studio selalu kembali
# menyala pada Apply berikutnya.
balance_enable: false
balance_hip_roll_gain: 0.35
balance_knee_gain: 0.4
balance_ankle_roll_gain: 0.7
balance_ankle_pitch_gain: 0.9
p_gain: 36
i_gain: 0
d_gain: 0

# ACUAN POSE BERDIRI -- ditambahkan 2026-09-09.
# =============================================================================
# TITIK NOL-nya adalah POSE PAGE 2. Semua offset di sini nol, artinya:
#
#     offset yang hidup SEMUANYA nol  ->  robot berdiri PERSIS di page 2
#     offset yang hidup menyimpang    ->  robot bergeser sebesar simpangan itu
#
#     pose = page 2 + [ neutral(offset yang hidup) - neutral(acuan ini) ]
#
# Jadi -0,34 pada init_pitch_offset berarti "0,34 rad lebih maju daripada
# page 2", dihitung langsung dari page 2, bukan dari nilai yang tersimpan
# sebelumnya. Itulah yang diminta operator 2026-09-09.
#
# KENAPA ADA. Sebelum ini acuannya diambil dari offset yang kebetulan sedang
# hidup pada saat walking_module dinyalakan. Akibatnya nilai yang baru saja
# di-Apply dikurangkan terhadap dirinya sendiri: hasilnya nol, robot berdiri
# persis di page 2, dan offset operator TIDAK PERNAH terasa. Gejalanya: "load
# nilai tersimpan lalu Apply & Start, robot tetap di page 2, jadi harus ditambah
# lagi tiap sesi" -- dan nilai tersimpannya memang menumpuk terus
# (-0,18 -> -0,28 -> -0,34) tanpa robot pernah berubah.
#
# KENAPA KUNCINYA TERPISAH, bukan memakai x_offset/pitch_offset di atas.
# Perintah "save" (tombol Simpan ke robot di Bascorro Studio) menuliskan seluruh
# nilai yang sedang hidup ke berkas ini. Kalau acuannya ikut kunci-kunci di atas,
# sekali Simpan acuannya sudah pindah ke nilai yang baru dipakai, dan pada boot
# berikutnya bug-nya kembali. Blok terpisah ini ditulis balik apa adanya oleh
# saveWalkingParam(), jadi kebal. Sudah dibuktikan dengan mengirim "save".
#
# KENAPA z_offset TIDAK NOL. z_offset menentukan dalamnya jongkok, bukan
# simpangan. Pada 0 m kaki diminta lurus 250,7 mm padahal jangkauannya cuma
# 220,2 mm, jadi IK-nya GAGAL dan acuannya tidak bisa dihitung sama sekali.
# 0,0408 adalah nilai yang dipakai keenam preset dan param.yaml, jadi z yang
# sama tidak menggeser apa-apa dan mengubah z tetap terasa seperti seharusnya.
#
# SKALA BARU -- BACA INI SEBELUM MEMAKAI NILAI LAMA. Karena titik nolnya pindah
# ke page 2, angka lama jadi jauh lebih besar artinya. Terhitung untuk
# init_x -0,018 dan hip_pitch 0,14 (pergeseran pergelangan terhadap page 2):
#
#     pitch  0,00  ->   -5,1 deg        pitch -0,12  ->  -12,8 deg
#     pitch -0,05  ->   -8,3 deg        pitch -0,18  ->  -16,5 deg
#     pitch -0,08  ->  -10,2 deg        pitch -0,34  ->  -26,2 deg  (TERLALU MIRING)
#
# Mulailah dari angka kecil dan naikkan pelan-pelan.
#
# SATUANNYA sama dengan blok di atas: METER untuk x/z, DERAJAT untuk sudut.
# Dibaca SEKALI saat boot -- sesudah diubah, jalankan ulang op3_manager.
bias_reference:
  x_offset: 0
  z_offset: 0.0408
  roll_offset: 0
  pitch_offset: 0
  yaw_offset: 0
  hip_pitch_offset: 0

/**:
  ros__parameters:
    # =====================================================
    # Robot Configuration
    # =====================================================
    robot:
      name: "op3"
      type: "ROBOTIS OP3"
      simulation: true
    
    # =====================================================
    # Camera Configuration
    # =====================================================
    camera:
      image_width: 1280
      image_height: 720
      encoding: "bgra8"
      
      focal_length: 900.0
      focal_length_x: 900.0
      focal_length_y: 900.0
      principal_point_x: 640.0
      principal_point_y: 360.0
      
      camera_height: 0.475
      camera_offset_x: 0.08
      camera_offset_z: 0.05
      
      camera_tilt: -0.349
      camera_pan: 0.0
      camera_roll: 0.0
      
      image_topic: "/robotis_op3/camera/image_raw"
      camera_info_topic: "/robotis_op3/camera/camera_info"
      
      camera_frame: "cam_link"
      base_frame: "base_link"
      head_frame: "head_link"
      world_frame: "odom"
    
    # =====================================================
    # Object Detection
    # =====================================================
    detection:
      model: "half_5.pt"
      confidence_threshold: 0.5
      iou_threshold: 0.45
      max_detections: 10
      device: "cpu"
      
      image_scale: 0.5
      skip_frames: 2
    
    # =====================================================
    # Field Line Detection
    # =====================================================
    field_lines:
      green_lower_hsv: [35, 40, 40]
      green_upper_hsv: [85, 255, 255]
      white_threshold: 200
      
      min_line_length: 20
      max_line_gap: 10
      line_thickness: 2
      
      hough_threshold: 50
      hough_min_line_length: 30
      hough_max_line_gap: 10
      
      max_distance: 5.0
      z_ground: 0.0
      min_points_per_line: 5
      
      point_spacing: 30
      publish_rate: 10.0
    
    # =====================================================
    # Field Dimensions
    # =====================================================
    field:
      length: 9.0
      width: 6.0
      line_width: 0.05
      center_circle_radius: 0.75
      
      penalty_area_length: 1.65
      penalty_area_width: 3.9
      penalty_mark_distance: 1.3
      
      goal_width: 2.6
      goal_depth: 0.6
      goal_height: 1.1
      goalpost_diameter: 0.1
    
    # =====================================================
    # Localization
    # =====================================================
    localization:
      initial_x: 0.0
      initial_y: 0.0
      initial_theta: 0.0
      
      initial_pos_variance: 1.0
      initial_theta_variance: 0.5
      
      vision_update_rate: 10.0
      publish_rate: 30.0
      
      line_match_tolerance: 0.2
      min_line_matches: 2
      max_position_jump: 1.0
      
      min_confidence: 0.3
      high_confidence: 0.8
    
    # =====================================================
    # Visualization
    # =====================================================
    visualization:
      publish_markers: true
      publish_debug_image: true
      marker_lifetime: 0.5
      
      detected_lines_color: [1.0, 0.0, 0.0, 1.0]
      matched_lines_color: [0.0, 1.0, 0.0, 1.0]
      field_lines_color: [1.0, 1.0, 1.0, 0.5]
      robot_pose_color: [0.0, 0.0, 1.0, 1.0]
    
    # =====================================================
    # Debug
    # =====================================================
    debug:
      verbose: true
      log_detections: false
      log_transforms: false
      save_debug_images: false
      debug_image_path: "/tmp/soccer_debug/"
# Parameters for the YOLO ball detector running an OpenVINO model.
# Same node (yolo_ball_detector.py) as the .pt/.onnx setups — only the weights
# differ. OpenVINO is the Intel-CPU runtime and is typically faster than
# onnxruntime on Intel boxes (e.g. the i5-1340P here).
# Applied via the "/**" wildcard so they reach the node regardless of the
# namespace/name it is launched under.
/**:
  ros__parameters:
    # OpenVINO model is a DIRECTORY (.xml + .bin + metadata.yaml), not a single
    # file. Relative to the package share dir or an absolute path.
    #
    # Bentuknya 384x640 (tinggi x lebar), BUKAN persegi -- lihat imgsz_hw di
    # bawah. Dan bobotnya INT8, bukan FP32.
    #
    # Kenapa INT8: demo penuh membuat inferensi FP32 melar jadi 47,7 ms --
    # MELEWATI jatah 41,7 ms per frame pada 24 FPS, jadi frame mulai hilang
    # (terukur di demo sungguhan: 7-11 FPS). INT8 memangkasnya cukup untuk
    # tetap masuk jatah walau CPU sedang diperebutkan:
    #
    #   kondisi                       FP32      INT8     jatah 24 FPS
    #   tanpa pesaing                 30,1 ms   16,9 ms   41,7 ms
    #   3 pesaing bebas (= demo)      47,7 ms   28,4 ms   41,7 ms   <- ini yang penting
    #   3 pesaing dikurung ke 3,7     33,6 ms   18,5 ms   41,7 ms
    #
    # Akurasinya diverifikasi, bukan diasumsikan (tes_infer.mp4, 30 frame):
    #   FP32: 30/30 deteksi, conf rata2 0,869, conf MIN 0,848
    #   INT8: 30/30 deteksi, conf rata2 0,856, conf MIN 0,843
    # Ulangi sendiri kapan saja: scripts/compare_ball_models.py
    #
    # PERINGATAN yang jujur: frame kalibrasinya direkam di dalam ruangan, BUKAN
    # di lapangan sebenarnya. Kuantisasi mempelajari rentang nilai dari contoh
    # yang diberikan, jadi kalau pencahayaan/warna lapangan jauh berbeda,
    # rekam ulang dan kuantisasi ulang:
    #   scripts/capture_calib_frames.py     (arahkan ke lapangan, bola macam2 jarak)
    #   scripts/quantize_ball_int8.py       (WAJIB di container --rm, baca docstring-nya)
    #   scripts/compare_ball_models.py      (gerbang kecepatan + akurasi)
    #
    # Jalan mundur: ganti ke "model/ball_yolov8n_384x640_openvino_model" (FP32,
    # sengaja ditinggal utuh). Yang 640x640 asli juga masih ada di
    # "model/ball_yolov8n_openvino_model". imgsz_hw tetap [384, 640] untuk
    # ketiganya.
    # DIPILIH OPERATOR 2026-09-06: kembali ke bobot v8n (kelas "Bola-baru"),
    # yaitu bobot yang tulisannya dikenal di lapangan.
    #
    # Bobot ini FP32 (int8: false) dan diekspor 320x320 PERSEGI.
    #
    # KECEPATAN: bukan taruhannya. Diukur di NUC ini, satu frame kamera yang
    # sama, 25 kali tiap bobot, dua kali dengan urutan dibalik supaya bukan
    # sekadar efek pemanasan:
    #     v8n  @320x320    83,8 dan 80,1 ms
    #     int8 @384x640   100,8 dan 104,0 ms
    # Jadi v8n justru LEBIH CEPAT di sini -- masukannya 320x320 (102k piksel)
    # lawan 384x640 (246k piksel), dan itu lebih menentukan daripada INT8.
    # Angka mutlaknya tinggi karena mesin sedang terpakai; yang berlaku
    # perbandingannya, bukan angkanya.
    #
    # YANG BENAR-BENAR DITUKAR: jangkauan. Dengan masukan PERSEGI, frame kamera
    # 640x360 dipadding jadi 320x320, sehingga bola menempati kira-kira setengah
    # ukuran linier dibanding 384x640. Bola JAUH jadi lebih sulit terdeteksi.
    # Bobotnya juga dilatih dari data yang berbeda (Bola-baru-1), jadi
    # perilakunya memang tidak sama.
    #
    # Radius yang dilaporkan TIDAK ikut mengecil: Ultralytics mengembalikan
    # kotak ke koordinat gambar asli, jadi kick_ball_radius_px tetap sebanding.
    #
    # Jalan kembali: model_path "model/ball_yolov8n_384x640_int8_openvino_model",
    # target_classes ["ball"], imgsz_hw [384, 640], dan kalau tulisannya ingin
    # tetap sama: display_class_names ["ball=Bola baru"].
    # DIGANTI 2026-09-18 ke bobot hasil latihan "merged_ball_v2"
    # (~/Downloads/train, YOLOv8n, 100 epoch diminta / berhenti di 69, terbaik
    # epoch 44: P 0,976 R 0,971 mAP50 0,986 mAP50-95 0,729). Kelasnya "ball".
    #
    # Diekspor 384x640 lalu dikuantisasi INT8 mengikuti strategi yang sudah
    # dipasang (lihat PANDUAN_OPTIMASI_FPS_DETEKSI.md):
    #   yolo export model=model/merged_ball_v2_best.pt format=openvino imgsz=384,640
    #   scripts/quantize_ball_int8.py --src <fp32> --dst <int8> --calib <frame>
    # Kalibrasi dari 200 frame kamera robot yang direkam SAAT DEMO BERJALAN
    # (model/calib_frames_demo_2026-09-18), bukan frame ruangan seperti dulu.
    #
    # KENAPA PINDAH DARI v8n: v8n berhalusinasi. Diukur pada 200 frame demo
    # 18 Sep (kamera menghadap dinding, TIDAK ADA bola sama sekali):
    #   v8n  : 197/200 frame "melihat bola", conf sampai 0,78, kotaknya
    #          595x360 px -- hampir seluruh bingkai. Karena radius bola
    #          diterbitkan dalam piksel, itu setara bola raksasa di depan kaki.
    #   baru : 0/200. Bahkan pada ambang 0,05 tidak keluar satu kotak pun.
    # Pada 200 frame kalibrasi 1 Sep keduanya 0/200 -- jadi halusinasi v8n
    # bergantung adegan, dan adegan dinding itu memicunya.
    #
    # Kesetiaan INT8 terhadap FP32-nya (tes_infer.mp4, 30 frame):
    #   FP32 30/30 conf rata2 0,865 min 0,857 | INT8 30/30 rata2 0,853 min 0,834
    # Ulangi kapan saja: scripts/compare_ball_models.py
    #
    # Jalan mundur: "model/merged_ball_v2_384x640_openvino_model" (FP32, sengaja
    # ditinggal utuh). Kembali ke v8n berarti mengembalikan JUGA imgsz_hw [0,0],
    # target_classes ["Bola-baru"] dan display_class_names [].
    # DIGANTI LAGI 2026-09-18 (malam) ke bobot "ball_gawang_v3"
    # (~/Downloads/ball_gawang_v3_models, YOLOv8n, dataset ball_gawang_v3).
    # Kelasnya DUA: {0: ball, 1: gawang}. Gawang HANYA untuk ditampilkan di
    # gambar debug -- lihat draw_all_classes di bawah; perilaku demo tetap
    # hanya melihat bola.
    #
    # Masukan dikecilkan 384x640 -> 288x480 (tetap 16:9, kelipatan 32) atas
    # permintaan operator supaya detektor lebih ringan saat demo. Harganya
    # bola tampak 25% lebih kecil secara linier di mata model. DIUKUR, bukan
    # diasumsikan (tes_infer.mp4, 30 frame, kelas ball saja):
    #
    #   bobot / bentuk                    ms/frame  deteksi  conf avg  conf MIN  radius px
    #   merged_ball_v2 384x640 INT8 (lama)   20,0    30/30    0,853     0,834     38,7
    #   ball_gawang_v3 384x640 FP32          33,6    30/30    0,878     0,849     36,7
    #   ball_gawang_v3 384x640 INT8          20,1    30/30    0,876     0,824     36,4
    #   ball_gawang_v3 288x480 INT8 (AKTIF)  12,5    30/30    0,843     0,789     36,2
    #
    # Radius (piksel gambar ASLI) hanya bergeser 0,5% dari 384x640, jadi
    # kick_image_width_px dan kalibrasi tendangan tidak perlu disentuh.
    # Deteksi palsu: 0 dari 400 frame tanpa bola pada ambang 0,30 (bola
    # maupun gawang); conf bola tertinggi pada adegan dinding 0,23.
    #
    # Kalibrasi INT8 dari 460 frame: 200 frame demo 18 Sep + 200 frame ruangan
    # 1 Sep + 60 frame tes_infer.mp4 (satu-satunya sumber bola). TIDAK ADA
    # frame gawang di kalibrasi -- kalau kotak gawang di lapangan tampak lemah,
    # rekam frame berisi gawang lalu kuantisasi ulang:
    #   scripts/capture_calib_frames.py ; scripts/quantize_ball_int8.py
    #   --calib <folder1> --calib <folder2> ... ; scripts/compare_ball_models.py
    #   --class ball
    #
    # Jalan mundur bertingkat (semua direktori ditinggal utuh):
    #   lebih akurat, lebih berat : "model/ball_gawang_v3_384x640_int8_openvino_model" + imgsz_hw [384, 640]
    #   bobot sebelumnya          : "model/merged_ball_v2_384x640_int8_openvino_model" + imgsz_hw [384, 640]
    #                               + draw_all_classes false + display_class_names ["ball=Bola-baru"]
    # DIGANTI 2026-11-03 atas permintaan operator ke bobot "robot_torso"
    # (~/Downloads/robot_torso_training_results.zip, YOLO11n, 6 kelas: ball,
    # goalpost, l, robot, t, x). SEMENTARA, untuk mencoba deteksi gawang dan
    # robot. Hanya ball/goalpost/robot yang aktif (lihat active_classes).
    # Diekspor 288x480 lalu INT8 (--ignore-head, kalibrasi 660 frame).
    # PERINGATAN: bola LEBIH LEMAH dari ball_gawang_v3 -- angkanya di komentar
    # active_classes di bawah.
    #
    # KEMBALI ke ball_gawang_v3 (direktori ditinggal utuh), ganti 4 baris:
    #   model_path: "model/ball_gawang_v3_288x480_int8_openvino_model"
    #   active_classes: []
    #   display_class_names: ["gawang=Gawang"]
    #   max_detections: 10
    model_path: "model/robot_torso_288x480_int8_openvino_model"

    # OpenVINO carries no task in the way ultralytics auto-detects reliably;
    # set it explicitly. This is a detection model.
    model_task: "detect"

    # Subscribe to a CompressedImage (true) or a raw Image (false) on image_in.
    use_compressed: true

    # Detection thresholds / inference settings.
    #
    # 0,5 -> 0,30 pada 2026-09-06, WAJIB menyertai bobot v8n.
    #
    # Bobot v8n memberi keyakinan jauh lebih rendah daripada ball_yolov8n untuk
    # bola yang sama. Diukur dari 30 frame BERURUTAN kamera robot, adegan sama:
    #
    #   bobot                    ambang 0,50   ambang 0,35   keyakinan rata
    #   v8n (Bola-baru)             0/30           30/30          0,45
    #   ball_yolov8n int8           30/30          30/30          0,85
    #
    # Jadi dengan ambang 0,50 robot TIDAK PERNAH melihat bola sama sekali --
    # puncak keyakinan v8n (0,45-0,47) memang di bawah ambangnya. Gejalanya di
    # lapangan: detektor hidup, gambar mengalir, tapi tidak ada satu pun kotak.
    #
    # 0,30 memberi jarak 0,15 dari rata-rata terukur. Angka ini terikat pada
    # bobot: kalau kembali ke ball_yolov8n, kembalikan juga ke 0,5 -- di sana
    # 0,30 cuma mengundang deteksi palsu. Diukur di dalam ruangan; di lapangan
    # dengan cahaya berbeda perlu diperiksa ulang.
    #
    # 18 Sep, bobot merged_ball_v2: nilainya SENGAJA DIBIARKAN 0,30 dan itu
    # terukur aman. Pada 400 frame tanpa bola (200 frame demo 18 Sep + 200
    # frame 1 Sep) bobot baru memberi NOL deteksi bahkan di ambang 0,05, jadi
    # 0,30 tidak mengundang deteksi palsu di sini. Bola sungguhan pada bobot
    # ini keluar di conf 0,83-0,87, jadi jaraknya lebar.
    confidence_threshold: 0.30
    iou_threshold: 0.45

    # imgsz WAJIB sama persis dengan bentuk saat model diekspor: masukan IR
    # OpenVINO itu STATIS dan menolak bentuk lain. Mengubahnya di sini saja
    # tidak cukup -- dan reshape() saat runtime juga tidak bisa, karena grid
    # anchor sudah dibakar jadi konstanta waktu ekspor.
    #
    # imgsz di bawah dipakai hanya kalau imgsz_hw dimatikan ([0, 0]).
    #
    # TIDAK DIPAKAI sejak 18 Sep: imgsz_hw aktif. Angka 320 ini peninggalan
    # bobot v8n; kalau imgsz_hw dikosongkan tanpa mengganti bobot, IR 384x640
    # akan menolak masukan 320x320.
    imgsz: 320

    # --- masukan PERSEGI PANJANG [tinggi, lebar] ---------------------------
    # Kamera 640x360. Dengan imgsz persegi, Ultralytics mem-padding jadi
    # 640x640 sebelum inferensi: hanya 230400 dari 409600 piksel yang berisi
    # gambar, jadi 44% komputasi habis memproses bar abu-abu.
    #
    # 384x640 mengikuti rasio kamera (360 dibulatkan ke kelipatan 32 stride).
    # Skala letterbox tetap 1,0 seperti sebelumnya, jadi bola TIDAK diperkecil
    # sedikit pun -- ini murni membuang padding, bukan menukar akurasi dengan
    # kecepatan.
    #
    # Terukur di NUC ini (ball_yolov8n, OpenVINO CPU, taskset 0-2):
    #   640x640 ... 42 ms  -> 24 FPS
    #   320x320 ... 12 ms  -> 85 FPS  (3,57x; TAPI bola ikut mengecil 2x)
    #   384x640 ... lihat baris "Model ceiling" di log saat node start
    #
    # [0, 0] mematikannya dan kembali ke imgsz persegi di atas.
    #
    # Nilai ini WAJIB sama dengan bentuk ekspor bobot yang aktif:
    #   ball_gawang_v3_288x480_* -> [288, 480]   (AKTIF)
    #   *_384x640_*              -> [384, 640]
    #   v8n_openvino_model       -> [0, 0]  (IR-nya statis 1x3x320x320)
    # 288x480 = 138k piksel vs 246k pada 384x640 (0,56x); terukur 1,71x lebih
    # cepat. Yang ditukar adalah jangkauan bola jauh, lihat tabel di model_path.
    imgsz_hw: [288, 480]

    # OpenVINO runs on the Intel CPU; keep device "cpu" and half false. (FP16 is
    # handled inside the OpenVINO IR, not via this flag.)
    device: "cpu"
    half: false
    # 10 -> 15 bersama robot_torso: bola + 2 tiang + beberapa robot tidak
    # boleh menyingkirkan bola dari jatah. Kembali 10 untuk ball_gawang_v3.
    max_detections: 15

    # Nama kelas DI DALAM MODEL yang dianggap "bola". Bobot merged_ball_v2
    # punya tepat satu kelas: "ball" (indeks 0).
    # Kalau tidak ada yang cocok, SEMUA kelas dianggap bola.
    #
    # Terikat pada bobot: nilai ini dan nama kelas di metadata.yaml model
    # harus sama persis.
    target_classes: ["ball"]

    # Gambar SEMUA kelas model di image_out, tapi teruskan ke circle_set /
    # ball_center HANYA kelas di target_classes. Dibuat untuk kelas "gawang"
    # pada bobot ball_gawang_v3: operator ingin melihatnya, demo tidak boleh
    # bereaksi padanya. Saringannya ada di _extract_circles (yolo_ball_detector
    # .py). Bawaan false untuk profil lain.
    draw_all_classes: true

    # Kelas yang DIDETEKSI + digambar saat draw_all_classes=true. Kelas di
    # target_classes selalu ikut. KOSONG = semua kelas model.
    #
    # Disiapkan 2026-11-03 untuk bobot robot_torso (YOLO11n, 6 kelas: ball,
    # goalpost, l, robot, t, x) -- yang diinginkan hanya ball/goalpost/robot.
    # DIAKTIFKAN 3 Nov walau gerbang bola gagal -- keputusan operator, untuk
    # mencoba gawang + robot. Angka gerbang (288x480, conf 0,30):
    #   tes_infer.mp4 60 frame : ball_gawang_v3 INT8 59/60 | robot_torso INT8 52/60
    #                            (FP32 384x640: 60/60 vs 40/60)
    #   260 frame gawang RF     : bola terdeteksi di 101 vs 20 frame -- bola
    #                            oranye kecil di lapangan dilewatkan
    #   INT8 setia ke FP32 (52 vs 52), jadi penurunannya dari bobotnya sendiri.
    # Yang LEBIH BAIK: tiang gawang putih di ruangan ALPHONSE (calib_frames)
    # terdeteksi 200/200 frame conf ~0,70; ball_gawang_v3 = 0.
    # Kembali ke ball_gawang_v3: lihat komentar di atas model_path.
    active_classes: ["ball", "goalpost", "robot"]

    # Nama yang ditulis di gambar debug (image_out), bentuknya
    # "nama_di_model=Nama Tampilan". KOSONG = pakai nama asli model.
    #
    # Dipakai sejak 18 Sep: bobot merged_ball_v2 menamai kelasnya "ball",
    # sedangkan tulisan yang dikenal operator di lapangan adalah "Bola-baru".
    # Ini HANYA mengganti tulisan di gambar debug; pemilihan kelas tetap lewat
    # target_classes dengan nama ASLI model -- jadi baris ini tidak bisa dipakai
    # untuk menyiasati ketidakcocokan label.
    # 3 Nov: "ball=Bola-baru" dihapus atas permintaan operator -- bola kini
    # tertulis "ball" (nama asli kelas di model).
    display_class_names: ["goalpost=Gawang", "robot=Robot"]

    # Inference loop rate (Hz). Always uses the freshest camera frame.
    #
    # Sempat diturunkan ke 12 Hz (2026-08-24) karena beban YOLO terlihat
    # meruntuhkan pembacaan posisi servo dari 125 Hz jadi 0,2 Hz. Itu memang
    # terukur, tapi DIAGNOSISNYA KELIRU: YOLO cuma memperbesar gejala, bukan
    # sebabnya. Akarnya ada di penjadwalan USB -- OpenCR full-speed 12 Mbit
    # menempel di hub yang sama dengan U2D2 dan menggerus byte balasan servo.
    # Sudah diperbaiki di robotis_controller.cpp (commit 2b76d84); baca alasan
    # lengkapnya di sana.
    #
    # Sesudah akar itu dibereskan, 25 Hz dikembalikan.
    #
    # SENGAJA JAUH DI ATAS LAJU KAMERA (20 Hz). Ini BUKAN target FPS, dan
    # menaikkannya tidak menambah beban -- baca dulu sebelum menurunkannya.
    #
    # Node ini memisahkan inferensi dari kedatangan frame: timer menyala pada
    # laju ini, mengambil gambar TERBARU, lalu memprosesnya. Kalau lajunya
    # terlalu dekat dengan laju kamera, keduanya BERADU-LAYANG. Executor rclpy
    # itu satu utas, jadi urutan yang sering terjadi:
    #   timer menyala -> _latest_image masih None -> keluar
    #   5 ms kemudian frame tiba dan hanya duduk menunggu
    #   tik timer berikutnya baru 40 ms lagi   <- frame terlambat penuh 40 ms
    #
    # TERUKUR di robot ini (kamera 20 FPS, model 384x640):
    #   detection_rate 25 Hz -> 13,4 FPS rata-rata   (33% frame hangus)
    #   detection_rate 60 Hz -> 19,4 FPS rata-rata   (mentok di kamera)
    #
    # Tik yang menyala saat belum ada frame baru harganya cuma satu lock plus
    # satu tes None, jadi menaikkannya praktis gratis.
    #
    # Dinaikkan 60 -> 100 saat kamera naik ke 24 FPS. Aritmetikanya:
    #   periode kamera 24 FPS = 41,7 ms ; inferensi ~30 ms
    #   agar frame tidak terlewat: 30 + periode_timer < 41,7
    #                           -> periode_timer < 11,7 ms  ->  laju > 85 Hz
    # 60 Hz (16,7 ms) sudah TIDAK cukup untuk 24 FPS. 100 Hz memberi marjin.
    #
    # Patokannya: setel MINIMAL 3x laju kamera, dan periksa ulang aritmetika di
    # atas setiap kali framerate di camera_param.yaml diubah.
    #
    # Riwayat, supaya tidak diputar balik lagi: sempat diturunkan ke 12 Hz
    # (2026-08-24) karena beban YOLO terlihat meruntuhkan pembacaan servo dari
    # 125 Hz jadi 0,2 Hz. Itu terukur, tapi DIAGNOSISNYA KELIRU -- akarnya
    # penjadwalan USB (OpenCR full-speed berbagi hub dengan U2D2), sudah
    # diperbaiki di robotis_controller.cpp commit 2b76d84.
    detection_rate: 100.0

    # Publish an annotated debug image on image_out.
    publish_image: true
    detection_frame_id: "detector"

    # Start detecting immediately, or wait for "enable" (std_msgs/Bool) = true.
    enable_at_start: true
    # Also publish the ball center as geometry_msgs/PointStamped in [0,1] image
    # coords on this topic (only while a ball is seen), feeding
    # op3_ball_localization/head_tracking_node in demo.launch.xml. Set "" to
    # disable. Leave absolute (leading /) so it is global across namespaces.
    ball_center_topic: "/vision/yolo/ball_center"

    # --- kunci SATU bola -----------------------------------------------------
    # Begitu satu bola terkunci, bola lain DIABAIKAN sampai yang terkunci
    # benar-benar hilang. Tanpa ini, tiap frame dipilih bola yang paling BESAR,
    # jadi dua bola berukuran mirip membuat pilihannya bertukar bolak-balik dan
    # kepala melompat di antara keduanya.
    #
    # Yang terkunci diterbitkan ke circle_set MAUPUN ball_center, jadi pelacak
    # kepala (python) dan BallTracker (C++) tidak bisa berbeda pendapat.
    # Kalau bola yang terkunci tidak terlihat di suatu frame, frame itu
    # dilaporkan KOSONG -- bukan diganti bola lain -- sehingga kepala menahan
    # posisi lewat lock_hold_sec, bukan melompat.
    single_target: true
    # Seberapa jauh bola boleh berpindah antar frame dan masih dianggap bola
    # YANG SAMA. Koordinat ternormalisasi [-1, 1], jadi lebar bingkai = 2,0.
    # Turunkan kalau dua bola berdekatan masih tertukar; naikkan kalau bola
    # sering terlepas saat kepala menyapu cepat.
    target_lock_radius: 0.40
    # Berapa lama bola terkunci boleh hilang sebelum boleh mengunci bola lain.
    # Sengaja lebih pendek dari lock_hold_sec (2,0 s) di head_tracking.yaml
    # supaya detektor sudah mengunci ulang sebelum kepala menyerah dan menyapu.
    target_lost_sec: 1.5
